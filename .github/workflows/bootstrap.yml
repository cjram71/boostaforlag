name: Bootstrap Boosta rebuild

on:
  push:
    branches:
      - agent/boosta-rebuild
    paths:
      - .github/workflows/bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack-build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/boosta-rebuild

      - name: Restore complete project
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/boosta-site.tar.gz
          echo "6c8feaaab83d071d46b997a12b7312038f2cf975c530dc16e4bff5a4ceb7a2f8  /tmp/boosta-site.tar.gz" | sha256sum --check
          tar -xzf /tmp/boosta-site.tar.gz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and Chromium
        id: install
        shell: bash
        continue-on-error: true
        run: |
          npm install 2>&1 | tee migration/npm-install.log
          INSTALL_STATUS=${PIPESTATUS[0]}
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npx playwright install --with-deps chromium 2>&1 | tee migration/playwright-install.log
            PLAYWRIGHT_STATUS=${PIPESTATUS[0]}
          else
            PLAYWRIGHT_STATUS=99
          fi
          echo "install_status=$INSTALL_STATUS" >> "$GITHUB_OUTPUT"
          echo "playwright_status=$PLAYWRIGHT_STATUS" >> "$GITHUB_OUTPUT"

      - name: Crawl, migrate, type-check, and build
        shell: bash
        run: |
          set +e
          if [ "${{ steps.install.outputs.install_status }}" = "0" ]; then
            npm run migrate:source 2>&1 | tee migration/migration-run.log
            MIGRATION_STATUS=${PIPESTATUS[0]}
            npm run typecheck 2>&1 | tee migration/typecheck.log
            TYPECHECK_STATUS=${PIPESTATUS[0]}
            npm run build 2>&1 | tee migration/build.log
            BUILD_STATUS=${PIPESTATUS[0]}
          else
            MIGRATION_STATUS=99
            TYPECHECK_STATUS=99
            BUILD_STATUS=99
          fi
          cat > migration/validation-status.md <<EOF
          # Automated validation status

          Generated by the bootstrap workflow.

          - Dependency installation: ${{ steps.install.outputs.install_status }}
          - Playwright Chromium installation: ${{ steps.install.outputs.playwright_status }}
          - Source crawl and asset migration: $MIGRATION_STATUS
          - TypeScript type-check: $TYPECHECK_STATUS
          - Production build: $BUILD_STATUS

          A status of `0` means success. A status of `99` means the step was skipped because dependency installation failed.
          EOF
          exit 0

      - name: Commit rebuilt website
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Boosta Förlag website"
          git push origin HEAD:agent/boosta-rebuild
