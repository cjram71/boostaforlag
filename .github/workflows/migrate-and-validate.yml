name: Migrate assets and validate

on:
  push:
    branches: ["agent/boosta-rebuild"]
    paths-ignore:
      - "public/assets/**"
      - "public/media/**"
      - "public/brand/boosta-logo-original.png"
      - "migration/asset-manifest.json"
      - "migration/source-crawl.json"
      - "migration/content-inventory.md"
      - "migration/source-*.png"
      - "migration/validation-status.md"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: boosta-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate:source
      - run: npm run typecheck
      - run: npm run build
      - name: Record successful validation
        shell: bash
        run: |
          cat > migration/validation-status.md <<EOF
          # Automated validation status

          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          - Dependency installation: passed
          - Playwright Chromium installation: passed
          - Rendered source crawl: passed
          - Asset migration: passed
          - TypeScript type-check: passed
          - Static production build: passed
          - Lighthouse: not recorded in this workflow; run separately against the deployed preview
          EOF
      - name: Commit migrated assets and reports
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets public/media public/brand/boosta-logo-original.png migration package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Validate migration and static build [skip ci]"
            git push
          fi
