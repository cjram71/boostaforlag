name: Migrate assets and validate
on:
  push:
    branches: ["agent/boosta-rebuild"]
    paths-ignore:
      - "public/assets/**"
      - "public/media/**"
      - "public/brand/boosta-logo-original.png"
      - "migration/asset-manifest.json"
      - "migration/source-crawl.json"
      - "migration/content-inventory.md"
      - "migration/source-*.png"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate:source
      - run: npm run typecheck
      - run: npm run build
      - name: Commit migrated assets and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets public/media public/brand/boosta-logo-original.png migration package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Migrate original site assets [skip ci]"
            git push
          fi
